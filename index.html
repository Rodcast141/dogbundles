<!DOCTYPE html>
<html>
<head>
    <title>Brainrot Animals</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene vr-mode-ui="enabled: true" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        
        <a-assets>
            <a-asset-item id="dog-model" src="https://cdn.aframe.io/examples/ar/models/pug/pug.glb"></a-asset-item>
        </a-assets>

        <a-entity id="rig" position="0 0.1 0" gorilla-movement>
            <a-camera id="camera" look-controls position="0 1.6 0">
                <a-entity id="hud" position="0 0.1 -0.5" scale="0.08 0.08 0.08">
                    <a-plane width="5" height="4.5" color="#ff00ff" opacity="0.6" position="0 2.5 -0.01"></a-plane>
                    <a-text value="BRAINROT ANIMALS" color="#ffff00" align="center" position="0 4.6 0.01" width="15"></a-text>
                    <a-text id="vr-coins" value="BUCKS: 0" color="#00ff00" align="center" position="0 3.8 0.01" width="12"></a-text>
                    <a-text value="--- PET BUNDLES ---" color="white" align="center" position="0 3.0 0.01" width="6"></a-text>
                    <a-text id="btn-gold" value="[ GOLD BUNDLE (10) ]" class="clickable" color="yellow" position="0 2.1 0.01" align="center" width="5" onclick="buyBundle('gold')"></a-text>
                    <a-text id="btn-speed" value="[ LONG ARMS (20) ]" class="clickable" color="cyan" position="0 1.2 0.01" align="center" width="5" onclick="buyBundle('speed')"></a-text>
                </a-entity>
                <a-entity id="my-dog-body" gltf-model="#dog-model" position="0 -0.5 0.3" rotation="0 180 0" scale="0.18 0.18 0.18"></a-entity>
            </a-camera>
            <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable; far: 5"></a-entity>
            <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable; far: 5"></a-entity>
        </a-entity>

        <a-octahedron class="clickable" position="-3 1.2 -4" color="#ff00ff" radius="0.6" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000" onclick="mineCrystal()"></a-octahedron>
        <a-octahedron class="clickable" position="0 1.5 -6" color="#ff00ff" radius="0.8" animation="property: rotation; to: 360 0 0; loop: true; dur: 4000" onclick="mineCrystal()"></a-octahedron>

        <a-entity environment="preset: candy; dressingAmount: 200; groundColor: #3a5f0b; skyColor: #6fc1ff; fog: 0.6"></a-entity>
    </a-scene>

    <script>
        let coins = 0; let speedMult = 2.8;
        function mineCrystal() {
            coins += 1;
            document.getElementById('vr-coins').setAttribute('value', `BUCKS: ${coins}`);
        }
        function buyBundle(type) {
            if (type === 'gold' && coins >= 10) {
                coins -= 10;
                document.getElementById('my-dog-body').setAttribute('material', 'color: gold; metalness: 1');
                document.getElementById('btn-gold').setAttribute('value', "OWNED");
            } 
            if (type === 'speed' && coins >= 20) {
                coins -= 20; speedMult = 5.0;
                document.getElementById('btn-speed').setAttribute('value', "OWNED");
            }
            document.getElementById('vr-coins').setAttribute('value', `BUCKS: ${coins}`);
        }
        AFRAME.registerComponent('gorilla-movement', {
            init: function () {
                this.leftHand = document.getElementById('leftHand');
                this.rightHand = document.getElementById('rightHand');
                this.prevL = new THREE.Vector3(); this.prevR = new THREE.Vector3();
                this.isL = false; this.isR = false;
                this.leftHand.addEventListener('triggerdown', () => { this.isL = true; this.prevL.copy(this.leftHand.object3D.position); });
                this.leftHand.addEventListener('triggerup', () => { this.isL = false; });
                this.rightHand.addEventListener('triggerdown', () => { this.isR = true; this.prevR.copy(this.rightHand.object3D.position); });
                this.rightHand.addEventListener('triggerup', () => { this.isR = false; });
            },
            tick: function () {
                let rig = this.el.object3D;
                if (this.isL) {
                    rig.position.x += (this.prevL.x - this.leftHand.object3D.position.x) * speedMult;
                    rig.position.z += (this.prevL.z - this.leftHand.object3D.position.z) * speedMult;
                    this.prevL.copy(this.leftHand.object3D.position);
                }
                if (this.isR) {
                    rig.position.x += (this.prevR.x - this.rightHand.object3D.position.x) * speedMult;
                    rig.position.z += (this.prevR.z - this.rightHand.object3D.position.z) * speedMult;
                    this.prevR.copy(this.rightHand.object3D.position);
                }
            }
        });
    </script>
</body>
</html>
