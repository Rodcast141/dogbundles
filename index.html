<!DOCTYPE html>
<html>
<head>
    <title>Brainrot Animals</title>
    <link rel="manifest" href="site.webmanifest" crossorigin="use-credentials">
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene vr-mode-ui="enabled: true" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        
        <a-entity id="rig" position="0 1 0" gorilla-movement>
            <a-camera id="camera" look-controls position="0 1.6 0">
                
                <a-entity id="hud" position="0 0.1 -0.5" scale="0.08 0.08 0.08">
                    <a-plane width="6" height="4" color="#ff00ff" opacity="0.8"></a-plane>
                    <a-text value="BRAINROT ANIMALS" color="yellow" align="center" position="0 1.5 0.01" width="12"></a-text>
                    <a-text id="vr-coins" value="BUCKS: 0" color="#00ff00" align="center" position="0 0.5 0.01" width="10"></a-text>
                </a-entity>

                <a-box id="my-dog-body" position="0 -0.8 -0.4" width="0.3" height="0.3" depth="0.5" color="orange">
                    <a-box position="0 0.2 -0.3" width="0.2" height="0.2" depth="0.2" color="black"></a-box> 
                </a-box>
            </a-camera>

            <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable; far: 5"></a-entity>
            <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable; far: 5"></a-entity>
        </a-entity>

        <a-octahedron class="clickable" position="-2 1.5 -3" color="#ff00ff" radius="0.5" onclick="mineCrystal()"></a-octahedron>
        <a-octahedron class="clickable" position="2 1.5 -3" color="#ff00ff" radius="0.5" onclick="mineCrystal()"></a-octahedron>

        <a-entity environment="preset: candy; dressingAmount: 100;"></a-entity>
    </a-scene>

    <script>
        let coins = 0;
        function mineCrystal() {
            coins += 1;
            document.getElementById('vr-coins').setAttribute('value', `BUCKS: ${coins}`);
        }

        AFRAME.registerComponent('gorilla-movement', {
            init: function () {
                this.leftHand = document.getElementById('leftHand');
                this.rightHand = document.getElementById('rightHand');
                this.prevL = new THREE.Vector3(); this.prevR = new THREE.Vector3();
                this.isL = false; this.isR = false;
                this.leftHand.addEventListener('triggerdown', () => { 
                    this.isL = true; 
                    this.prevL.copy(this.leftHand.object3D.position); 
                });
                this.leftHand.addEventListener('triggerup', () => { this.isL = false; });
                this.rightHand.addEventListener('triggerdown', () => { 
                    this.isR = true; 
                    this.prevR.copy(this.rightHand.object3D.position); 
                });
                this.rightHand.addEventListener('triggerup', () => { this.isR = false; });
            },
            tick: function () {
                let rig = this.el.object3D;
                let strength = 4.5; // Gorilla Tag push strength
                if (this.isL) {
                    rig.position.x += (this.prevL.x - this.leftHand.object3D.position.x) * strength;
                    rig.position.z += (this.prevL.z - this.leftHand.object3D.position.z) * strength;
                    this.prevL.copy(this.leftHand.object3D.position);
                }
                if (this.isR) {
                    rig.position.x += (this.prevR.x - this.rightHand.object3D.position.x) * strength;
                    rig.position.z += (this.prevR.z - this.rightHand.object3D.position.z) * strength;
                    this.prevR.copy(this.rightHand.object3D.position);
                }
            }
