
<!DOCTYPE html>
<html>
<head>
    <title>Gorilla Dog VR</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene vr-mode-ui="enabled: true" renderer="antialias: true">
        
        <a-assets>
            <a-asset-item id="dog-model" src="https://cdn.aframe.io/examples/ar/models/pug/pug.glb"></a-asset-item>
        </a-assets>

        <a-entity id="rig" position="0 0.1 0" gorilla-movement>
            <a-camera id="camera" look-controls position="0 1.6 0">
                <a-entity id="hud" position="0 0 -0.7" scale="0.1 0.1 0.1">
                    <a-plane width="4" height="3" color="black" opacity="0.8"></a-plane>
                    <a-text id="vr-coins" value="BUCKS: 0" color="green" align="center" position="0 1 0.01"></a-text>
                    <a-text value="[ CLICK CRYSTAL TO MINE ]" color="white" align="center" position="0 0 0.01" width="3"></a-text>
                    <a-text id="btn-gold" value="[ GOLD BUNDLE (10) ]" class="clickable" color="yellow" position="0 -0.8 0.01" align="center" width="4" onclick="buyBundle('gold')"></a-text>
                </a-entity>

                <a-entity id="my-dog-body" gltf-model="#dog-model" position="0 -0.5 0.3" rotation="0 180 0" scale="0.15 0.15 0.15"></a-entity>
            </a-camera>

            <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable; far: 5"></a-entity>
            <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable; far: 5"></a-entity>
        </a-entity>

        <a-entity environment="preset: forest; dressingAmount: 100; groundColor: #44512a"></a-entity>
        <a-sky color="#87CEEB"></a-sky>

        <a-octahedron id="crystal" class="clickable" position="0 1.2 -3" color="magenta" radius="0.5" 
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"
                      onclick="mineCrystal()">
        </a-octahedron>

    </a-scene>

    <script>
        let coins = 0;
        let speedMult = 2; // Made this faster so you can actually move!

        function mineCrystal() {
            coins += 1;
            document.getElementById('vr-coins').setAttribute('value', `BUCKS: ${coins}`);
        }

        function buyBundle(type) {
            if (type === 'gold' && coins >= 10) {
                coins -= 10;
                document.getElementById('my-dog-body').setAttribute('material', 'color: gold; metalness: 0.9');
                document.getElementById('btn-gold').setAttribute('value', "GOLD UNLOCKED");
            }
        }

        // GORILLA MOVEMENT SCRIPT
        AFRAME.registerComponent('gorilla-movement', {
            init: function () {
                this.leftHand = document.getElementById('leftHand');
                this.rightHand = document.getElementById('rightHand');
                this.prevL = new THREE.Vector3();
                this.prevR = new THREE.Vector3();
                this.isL = false; this.isR = false;

                this.leftHand.addEventListener('triggerdown', () => { this.isL = true; this.prevL.copy(this.leftHand.object3D.position); });
                this.leftHand.addEventListener('triggerup', () => { this.isL = false; });
                this.rightHand.addEventListener('triggerdown', () => { this.isR = true; this.prevR.copy(this.rightHand.object3D.position); });
                this.rightHand.addEventListener('triggerup', () => { this.isR = false; });
            },
            tick: function () {
                if (this.isL) {
                    let moveX = (this.prevL.x - this.leftHand.object3D.position.x) * speedMult;
                    let moveZ = (this.prevL.z - this.leftHand.object3D.position.z) * speedMult;
                    this.el.object3D.position.x += moveX;
                    this.el.object3D.position.z += moveZ;
                    this.prevL.copy(this.leftHand.object3D.position);
                }
