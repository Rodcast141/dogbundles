<!DOCTYPE html>
<html>
<head>
    <title>Brainrot Pets: GitHub Edition</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene vr-mode-ui="enabled: true" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        
        <a-assets>
            <a-asset-item id="dog-model" src="https://cdn.aframe.io/examples/ar/models/pug/pug.glb"></a-asset-item>
        </a-assets>

        <a-entity id="rig" position="0 0.1 0" gorilla-movement>
            <a-camera id="camera" look-controls position="0 1.6 0">
                
                <a-entity id="hud" position="0 0 -0.6" scale="0.1 0.1 0.1">
                    <a-plane width="5" height="4" color="#ff00ff" opacity="0.6" position="0 2.5 -0.02"></a-plane>
                    
                    <a-text id="vr-coins" value="BUCKS: 0" color="#ffff00" align="center" position="0 3.8 0.01" width="12" font="kelsonsans"></a-text>
                    
                    <a-text value="--- BUNDLE SHOP ---" color="white" align="center" position="0 2.8 0.01" width="7"></a-text>
                    <a-text id="btn-gold" value="[ GOLD BUNDLE (10) ]" class="clickable" color="#00ffff
